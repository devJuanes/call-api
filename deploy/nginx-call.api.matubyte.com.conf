# /etc/nginx/sites-available/call.api.matubyte.com
# DNS A: call.api → 13.140.160.248 (matubyte.com)
# Certbot: sudo certbot --nginx -d call.api.matubyte.com

upstream matucall_api {
    server 127.0.0.1:4110;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name call.api.matubyte.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name call.api.matubyte.com;

    # Certbot managed:
    # ssl_certificate /etc/letsencrypt/live/call.api.matubyte.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/call.api.matubyte.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://matucall_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://matucall_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
